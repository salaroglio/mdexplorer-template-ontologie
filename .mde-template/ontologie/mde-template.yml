mde_template: 2
id: ontologie
kind: method
title: Ontologies
description: "Design an ontology starting from the questions it must answer: schema, rules and examples, checked before accepting it."
version: 2.0.0
requires:
  mde: 2026.10.21.2
  features: [fuseki]
languages:
  it: { structure: main, example: esempio }
  en: { structure: en, example: example }
instructions: .mde-template/ontologie/instructions.md
slides:
  en: .mde-template/ontologie/presentation.md
theory:
  en: { from: .mde-template/ontologie/theory, to: theory/ontologie }
seeds:
  - { from: .mde-template/ontologie/seeds/README.md, to: ontology/README.md }
  - { from: .mde-template/ontologie/seeds/domain.md, to: ontology/domain.md }
  - { from: .mde-template/ontologie/seeds/tbox.md, to: ontology/TBox/README.md }
  - { from: .mde-template/ontologie/seeds/abox.md, to: ontology/ABox/README.md }
  - { from: .mde-template/ontologie/seeds/shapes.md, to: ontology/Shapes/README.md }
  - { from: .mde-template/ontologie/seeds/queries.md, to: ontology/queries/README.md }
skills:
  - .mde-template/ontologie/skills/ontologie-questions
agent_city:
  roles:
    - { role: Domain owner, description: "approves the competency questions and decides whether the ontology is accepted", agents: [ontologie-analyst] }
    - { role: Ontologist, description: "approves schema, rules, examples and check", agents: [ontologie-ontologist, ontologie-checker] }
  workflows:
    - .mde-template/ontologie/workflows/ontology.md
