mde_template: 1
id: ontologie
kind: method
title: Ontologie
description: "Disegnare un'ontologia partendo dalle domande a cui deve rispondere: schema, regole ed esempi, verificati prima di accettarla."
version: 1.0.0
requires:
  mde: 2026.10.18
  features: [fuseki]
languages:
  it: { structure: main, example: esempio }
roles:
  - { role: Responsabile del dominio, description: "approva le domande di competenza e decide se l'ontologia è accettata", agents: [ontologie-analista] }
  - { role: Ontologo, description: "approva schema, regole, esempi e verifica", agents: [ontologie-ontologo, ontologie-verificatore] }
workflows:
  - .mde-template/ontologie/workflows/ontologia.md
instructions: .mde-template/ontologie/istruzioni.md
seeds:
  - { from: .mde-template/ontologie/semi/README.md, to: ontology/README.md }
  - { from: .mde-template/ontologie/esempio/dominio.md, to: ontology/dominio.md }
  - { from: .mde-template/ontologie/semi/tbox.md, to: ontology/TBox/README.md }
  - { from: .mde-template/ontologie/semi/abox.md, to: ontology/ABox/README.md }
  - { from: .mde-template/ontologie/semi/shapes.md, to: ontology/Shapes/README.md }
  - { from: .mde-template/ontologie/semi/queries.md, to: ontology/queries/README.md }
  - { from: .mde-template/ontologie/esempio/fonte-gara.md, to: ontology/fonti/gara-nordica.md }
  - { from: .mde-template/ontologie/esempio/domande.md, to: ontology/domande.md }
  - { from: .mde-template/ontologie/esempio/gara.ttl, to: ontology/TBox/gara.ttl }
  - { from: .mde-template/ontologie/esempio/gara.shapes.ttl, to: ontology/Shapes/gara.shapes.ttl }
  - { from: .mde-template/ontologie/esempio/gara-nordica.ttl, to: ontology/ABox/gara-nordica.ttl }
  - { from: .mde-template/ontologie/esempio/c1-bandi-aperti.rq, to: ontology/queries/c1-bandi-aperti.rq }
  - { from: .mde-template/ontologie/esempio/c2-scadenza.rq, to: ontology/queries/c2-scadenza.rq }
  - { from: .mde-template/ontologie/esempio/c3-nel-registro.rq, to: ontology/queries/c3-nel-registro.rq }
  - { from: .mde-template/ontologie/esempio/c4-criteri-bloccanti.rq, to: ontology/queries/c4-criteri-bloccanti.rq }
  - { from: .mde-template/ontologie/esempio/c5-chi-valuta-competenza.rq, to: ontology/queries/c5-chi-valuta-competenza.rq }
  - { from: .mde-template/ontologie/esempio/verifica.md, to: ontology/verifica.md }
  - { from: .mde-template/ontologie/esempio/gara.md, to: ontology/TBox/gara.md }
  - { from: .mde-template/ontologie/esempio/gara-nordica.md, to: ontology/ABox/gara-nordica.md }
  - { from: .mde-template/ontologie/esempio/gara.shapes.md, to: ontology/Shapes/gara.shapes.md }
